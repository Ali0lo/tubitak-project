apiVersion: v1
kind: Secret
metadata:
  name: workspace-engine-secrets
  namespace: workspace-engine
  labels:
    app.kubernetes.io/name: workspace-engine
    app.kubernetes.io/part-of: workspace-engine
type: Opaque
stringData:
  POSTGRES_DB: "workspace_engine"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgrespassword"
  DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@postgres-service:5432/workspace_engine"
  REDIS_URL: "redis://redis-service:6379/0"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
  JWT_SECRET_KEY: "workspace-engine-production-super-secret-jwt-key"
